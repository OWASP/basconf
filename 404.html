<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BASC 2027</title>
    <!--
      Cloudflare Pages serves the SPA for every route via public/_redirects
      (/* -> /index.html 200), so this file is normally never shown. It is a
      no-JS fallback for any host that lacks redirect support. No inline script,
      so it stays clean under the Content-Security-Policy in _headers.
    -->
    <meta http-equiv="refresh" content="0; url=/" />
    <link rel="canonical" href="/" />
  </head>
  <body>
    <p>Redirecting to <a href="/">basconf.org</a>…</p>
  </body>
</html>
